<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DataTiles NetCDF preview</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#07131d;color:#e9f4fa}body{margin:0}header,main{max-width:1040px;margin:auto;padding:1rem}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:1.35rem;margin:0}a{color:#65c9ff}.panel{background:#102432;border:1px solid #28485b;border-radius:12px;padding:1rem}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.75rem;margin-bottom:1rem}label{font-size:.78rem;color:#a9c4d3}select,input,button{width:100%;box-sizing:border-box;margin-top:.25rem;padding:.55rem;border-radius:7px;border:1px solid #426276;background:#091a26;color:#fff}button{cursor:pointer;background:#1678a5;font-weight:700}canvas{display:block;width:min(100%,512px);height:auto;image-rendering:pixelated;background:#061018;border:1px solid #345468;margin:auto}.status{margin:.8rem 0 0;color:#b8cfda;min-height:1.5rem}.warning{color:#ffd27a;font-size:.85rem}code{word-break:break-all}</style></head>
<body><header><h1>DataTiles · direct NetCDF delivery</h1><nav><a id="docs" href="/docs">API docs</a> · <a id="discovery" href="/api/netcdf">JSON discovery</a></nav></header>
<main><section class="panel"><div class="controls">
<label>Product<select id="product"></select></label><label>Domain<select id="domain"></select></label><label>Time<select id="time"></select></label><label>Variable<select id="variable"></select></label>
<label>Zoom<input id="z" type="number" min="0" max="22" value="5"></label><label>Tile X<input id="x" type="number" min="0" value="16"></label><label>Tile Y<input id="y" type="number" min="0" value="11"></label><label>Action<button id="load" aria-label="Load numeric tile">Load numeric tile</button></label>
</div><canvas id="tile" width="256" height="256"></canvas><p class="status" id="status">Discovering configured archive frames…</p>
<p class="warning">Client-side diagnostic portrayal of numeric values. Sources and this preview are uncertified and MUST NOT be used for navigation.</p></section></main>
<script>
const $=id=>document.getElementById(id), state={products:[]}, apiBase=location.protocol==='file:'?'http://127.0.0.1:8080':'';
$('docs').href=apiBase+'/docs';$('discovery').href=apiBase+'/api/netcdf';
function options(el,values,key){el.innerHTML=values.map(v=>`<option>${key?v[key]:v}</option>`).join('')}
function selectProduct(){const p=state.products.find(v=>v.id===$('product').value);options($('variable'),p?.variables||[]);options($('domain'),p?.frames||[],'domain');selectDomain()}
function selectDomain(){const p=state.products.find(v=>v.id===$('product').value),d=$('domain').value;options($('time'),(p?.frames||[]).filter(v=>v.domain===d),'time')}
async function discover(){try{const r=await fetch(apiBase+'/api/netcdf');if(!r.ok)throw Error(await r.text());state.products=(await r.json()).products;options($('product'),state.products,'id');selectProduct();$('status').textContent=state.products.length?'Choose a frame and load its DNT1 tile.':'No NetCDF products are configured.'}catch(e){$('status').textContent=`Discovery failed. Start the demo server at http://127.0.0.1:8080, then reload this page. (${e.message})`}}
function decode(buffer){const b=new Uint8Array(buffer);if(String.fromCharCode(...b.slice(0,4))!=='DNT1')throw Error('response is not DNT1');const view=new DataView(buffer),n=view.getUint32(4),h=JSON.parse(new TextDecoder().decode(b.slice(8,8+n))),raw=buffer.slice(8+n);if(h.compression!=='none')throw Error('browser preview requires uncompressed DNT1');const little=h.byteorder==='little',dv=new DataView(raw),read={float32:(o)=>dv.getFloat32(o,little),float64:(o)=>dv.getFloat64(o,little)}[h.dtype];if(!read)throw Error(`unsupported preview dtype ${h.dtype}`);const size=h.dtype==='float64'?8:4,values=Array.from({length:h.shape.reduce((a,v)=>a*v,1)},(_,i)=>read(i*size));return {h,values}}
async function load(){const p=$('product').value,d=$('domain').value,t=$('time').value,v=$('variable').value,z=$('z').value,x=$('x').value,y=$('y').value;if(!p||!d||!t||!v)return;$('status').textContent='Loading numeric tile…';try{const path=`/api/netcdf/${encodeURIComponent(p)}/${encodeURIComponent(d)}/${encodeURIComponent(t)}/tiles/${z}/${x}/${y}?variable=${encodeURIComponent(v)}&compression=none`,url=apiBase+path,r=await fetch(url);if(!r.ok)throw Error(await r.text());const q=decode(await r.arrayBuffer()),valid=q.values.filter(n=>Number.isFinite(n)&&n!==q.h.nodata);if(!valid.length)throw Error('selected tile contains only nodata');const lo=Math.min(...valid),hi=Math.max(...valid),[height,width]=q.h.shape.slice(-2),c=$('tile'),ctx=c.getContext('2d');c.width=width;c.height=height;const image=ctx.createImageData(width,height);q.values.forEach((n,i)=>{const ok=Number.isFinite(n)&&n!==q.h.nodata,f=ok?(n-lo)/(hi-lo||1):0;image.data.set(ok?[Math.round(30+220*f),Math.round(90+140*(1-Math.abs(f-.5)*2)),Math.round(230-180*f),255]:[0,0,0,0],i*4)});ctx.putImageData(image,0,0);$('status').innerHTML=`${v}: ${lo.toFixed(3)}–${hi.toFixed(3)} ${q.h.unit||''} · ${width}×${height} · <code>${path}</code>`}catch(e){$('status').textContent=`Tile failed: ${e.message}`}}
$('product').onchange=selectProduct;$('domain').onchange=selectDomain;$('load').onclick=load;discover();
</script></body></html>
