<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 640">
  <title id="title">DataTiles Store branding and Bootstrap theme pipeline</title>
  <desc id="desc">An administrator submits constrained name, tagline, colour, card, background, text, radius, shadow and font settings plus an optional validated raster logo. Flask validates them, SQLAlchemy stores text settings, the logo is normalized to PNG, and escaped CSS properties customize the locally vendored Bootstrap interface.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#173548"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#72d2d2"/></marker><filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-opacity=".28"/></filter></defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/><text x="58" y="68" fill="#eef7f8" font-family="system-ui" font-size="31" font-weight="700">Branding changes presentation, never scientific evidence</text><text x="58" y="102" fill="#9eb7c2" font-family="system-ui" font-size="16">Bootstrap is vendored locally; all administrator-supplied style values cross an allowlisted validation boundary.</text>
  <g font-family="system-ui" filter="url(#shadow)"><rect x="55" y="170" width="245" height="285" rx="18" fill="#102f40" stroke="#3f6d7e"/><text x="82" y="210" fill="#79d6d4" font-size="19" font-weight="700">Configuration UI / API</text><text x="82" y="248" fill="#eef7f8" font-size="14">Store name · tagline</text><text x="82" y="278" fill="#eef7f8" font-size="14">Bootstrap colour tokens</text><text x="82" y="308" fill="#eef7f8" font-size="14">Card · radius · shadow · font</text><text x="82" y="338" fill="#eef7f8" font-size="14">PNG · JPEG · WebP logo</text><text x="82" y="382" fill="#9eb7c2" font-size="13">browser: CSRF protected</text><text x="82" y="407" fill="#9eb7c2" font-size="13">API: administrator Bearer token</text>
  <rect x="400" y="170" width="300" height="285" rx="18" fill="#143746" stroke="#5aa3ae"/><text x="430" y="210" fill="#79d6d4" font-size="19" font-weight="700">Validation boundary</text><text x="430" y="250" fill="#eef7f8" font-size="14">#RRGGBB colours</text><text x="430" y="280" fill="#eef7f8" font-size="14">fixed choice allowlists</text><text x="430" y="310" fill="#eef7f8" font-size="14">length + control-character checks</text><text x="430" y="340" fill="#eef7f8" font-size="14">2 MiB / 4 MP image bounds</text><text x="430" y="370" fill="#eef7f8" font-size="14">decode, verify, normalize PNG</text><text x="430" y="414" fill="#f2c987" font-size="13">SVG and arbitrary CSS rejected</text>
  <rect x="800" y="138" width="340" height="150" rx="18" fill="#173b3a" stroke="#4f8f7e"/><text x="830" y="178" fill="#9fe0c3" font-size="18" font-weight="700">Operational persistence</text><text x="830" y="212" fill="#eef7f8" font-size="14">SQLAlchemy settings table</text><text x="830" y="239" fill="#eef7f8" font-size="14">BRANDING_DIR/store-logo.png</text><text x="830" y="264" fill="#9eb7c2" font-size="13">back up together; separate from DataTiles</text>
  <rect x="800" y="338" width="340" height="150" rx="18" fill="#27344d" stroke="#707fae"/><text x="830" y="378" fill="#bdc8ff" font-size="18" font-weight="700">Rendered Bootstrap PWA</text><text x="830" y="412" fill="#eef7f8" font-size="14">escaped CSS custom properties</text><text x="830" y="439" fill="#eef7f8" font-size="14">responsive cards · navigation · forms</text><text x="830" y="464" fill="#9eb7c2" font-size="13">dynamic manifest and public normalized logo</text></g>
  <g fill="none" stroke="#72d2d2" stroke-width="3" marker-end="url(#arrow)"><path d="M300 312H390"/><path d="M700 250L790 218"/><path d="M700 350L790 405"/></g><text x="58" y="568" fill="#d8c68f" font-family="system-ui" font-size="14">The logo and theme are institutional presentation metadata; they do not alter DNT1 arrays, vectors, provenance, checksums, licences, or release identity.</text>
</svg>
