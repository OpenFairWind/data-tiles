<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 620">
  <title id="title">DataTiles Store protected-access decision sequence</title><desc id="desc">A preview or download request passes authentication, permission, release-specific agreement, and optional paid entitlement checks before exact data access is allowed.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#07131f"/><stop offset="1" stop-color="#132a35"/></linearGradient><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#71ccd0"/></marker></defs><rect width="1200" height="620" rx="28" fill="url(#bg)"/><text x="58" y="68" fill="#eef7f8" font-family="system-ui" font-size="31" font-weight="700">Protected access is a sequence, not one boolean</text><text x="58" y="101" fill="#9eb7c2" font-family="system-ui" font-size="16">Each failure produces a distinct response and preserves the boundary between law, safety, payment, and data.</text>
  <g font-family="system-ui" text-anchor="middle"><g fill="#102f40" stroke="#416b7b"><rect x="55" y="205" width="170" height="115" rx="16"/><rect x="270" y="205" width="170" height="115" rx="16"/><rect x="485" y="205" width="190" height="115" rx="16"/><rect x="720" y="205" width="190" height="115" rx="16"/><rect x="955" y="205" width="190" height="115" rx="16"/></g><g fill="#eef7f8" font-size="17" font-weight="700"><text x="140" y="252">Authenticate</text><text x="355" y="252">Authorize</text><text x="580" y="244">Accept exact</text><text x="580" y="268">release terms</text><text x="815" y="244">Verify paid</text><text x="815" y="268">entitlement</text><text x="1050" y="244">Serve exact tile</text><text x="1050" y="268">or file</text></g><g fill="#9eb7c2" font-size="13"><text x="140" y="292">session / token</text><text x="355" y="292">role permission</text><text x="580" y="294">SHA + rights + safety</text><text x="815" y="294">only when required</text><text x="1050" y="294">no silent transform</text></g></g>
  <g fill="none" stroke="#71ccd0" stroke-width="3" marker-end="url(#m)"><path d="M225 262H263"/><path d="M440 262H478"/><path d="M675 262H713"/><path d="M910 262H948"/></g>
  <g font-family="system-ui"><g fill="#4a2024" stroke="#a65d61"><rect x="55" y="410" width="170" height="84" rx="13"/><rect x="270" y="410" width="170" height="84" rx="13"/><rect x="485" y="410" width="190" height="84" rx="13"/><rect x="720" y="410" width="190" height="84" rx="13"/></g><g fill="#ffd1d1" font-size="15" font-weight="700" text-anchor="middle"><text x="140" y="444">401</text><text x="355" y="444">403</text><text x="580" y="444">428</text><text x="815" y="444">402</text></g><g fill="#d7aeb0" font-size="12" text-anchor="middle"><text x="140" y="470">authentication required</text><text x="355" y="470">permission denied</text><text x="580" y="470">agreement required</text><text x="815" y="470">purchase required</text></g><g fill="none" stroke="#a65d61" stroke-width="2" stroke-dasharray="5 5"><path d="M140 320V410"/><path d="M355 320V410"/><path d="M580 320V410"/><path d="M815 320V410"/></g></g><text x="58" y="565" fill="#d8c68f" font-family="system-ui" font-size="14">Agreement acceptance acknowledges published terms; it does not create upstream redistribution rights or certify navigation fitness.</text>
</svg>
