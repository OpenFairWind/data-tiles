<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 650">
  <title id="title">Client-side DNT1 preview pipeline</title><desc id="desc">The Store reads one selected-slice tile without transformation, sends exact DNT1 bytes, and the browser defensively decodes values and creates an ephemeral colour portrayal.</desc>
  <defs><linearGradient id="b"><stop stop-color="#06121d"/><stop offset="1" stop-color="#102b39"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#70d0cf"/></marker></defs><rect width="1200" height="650" rx="28" fill="url(#b)"/><text x="60" y="70" fill="#eef7f8" font-family="system-ui" font-size="31" font-weight="700">Scientific preview preserves the evidence/portrayal boundary</text><text x="60" y="104" fill="#9eb7c2" font-family="system-ui" font-size="16">Stored numeric arrays remain authoritative; browser pixels are disposable explanatory output.</text>
  <g font-family="system-ui"><rect x="55" y="170" width="270" height="250" rx="20" fill="#26334d" stroke="#7483b1"/><text x="85" y="215" fill="#c5ceff" font-size="20" font-weight="700">Revision-8 DataTiles</text><text x="85" y="252" fill="#eef7f8" font-size="14">selected coordinate set</text><text x="85" y="282" fill="#eef7f8" font-size="14">DNT1 header + payload</text><text x="85" y="312" fill="#eef7f8" font-size="14">dtype · shape · byte order</text><text x="85" y="342" fill="#eef7f8" font-size="14">nodata · scale · offset · unit</text><text x="85" y="390" fill="#9eb7c2" font-size="13">opened read-only; bytes unchanged</text>
  <rect x="465" y="170" width="270" height="250" rx="20" fill="#123747" stroke="#58a5ad"/><text x="495" y="215" fill="#79d6d4" font-size="20" font-weight="700">Store transport</text><text x="495" y="252" fill="#eef7f8" font-size="14">agreement + permission gate</text><text x="495" y="282" fill="#eef7f8" font-size="14">exact selected tile response</text><text x="495" y="312" fill="#eef7f8" font-size="14">private, no-store caching</text><text x="495" y="342" fill="#eef7f8" font-size="14">encoding/profile headers</text><text x="495" y="390" fill="#9eb7c2" font-size="13">no resampling or server portrayal</text>
  <rect x="875" y="170" width="270" height="250" rx="20" fill="#173b3a" stroke="#4f927f"/><text x="905" y="215" fill="#9fe0c3" font-size="20" font-weight="700">Browser portrayal</text><text x="905" y="252" fill="#eef7f8" font-size="14">defensive bounded decode</text><text x="905" y="282" fill="#eef7f8" font-size="14">raw nodata exclusion</text><text x="905" y="312" fill="#eef7f8" font-size="14">physical = raw × scale + offset</text><text x="905" y="342" fill="#eef7f8" font-size="14">declared deterministic colour ramp</text><text x="905" y="390" fill="#9eb7c2" font-size="13">ephemeral canvas; never written back</text></g>
  <g fill="none" stroke="#70d0cf" stroke-width="4" marker-end="url(#a)"><path d="M325 295H455"/><path d="M735 295H865"/></g><g font-family="system-ui" fill="#9eb7c2" font-size="13" text-anchor="middle"><text x="390" y="278">SQLAlchemy query-only</text><text x="800" y="278">HTTPS exact bytes</text></g>
  <rect x="190" y="500" width="820" height="85" rx="15" fill="#2d2615" stroke="#7b6a38"/><text x="600" y="535" text-anchor="middle" fill="#f0dca0" font-family="system-ui" font-size="16" font-weight="700">Interpretation limit</text><text x="600" y="562" text-anchor="middle" fill="#d5c79e" font-family="system-ui" font-size="13">A colour preview supports inspection; it is not a stored scientific variable, certified chart, or proof of validity.</text>
</svg>
