<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 680">
  <title id="title">DataTiles Store architecture and trust boundaries</title>
  <desc id="desc">Users and API clients reach the Bootstrap PWA and Flask routes, authorization and agreement gates, the SQLAlchemy operational database, normalized branding assets, immutable DataTiles catalog files, and external identity, mail, and payment providers.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#102a38"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".28"/></filter><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#79d6d4"/></marker></defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/><text x="60" y="72" fill="#eef7f8" font-family="system-ui" font-size="32" font-weight="700">DataTiles Store — architecture</text><text x="60" y="104" fill="#9eb7c2" font-family="system-ui" font-size="16">Operational state stays separate from immutable scientific publication objects.</text>
  <g font-family="system-ui" filter="url(#s)"><rect x="60" y="170" width="220" height="150" rx="18" fill="#102f40" stroke="#3f6d7e"/><text x="90" y="210" fill="#79d6d4" font-size="18" font-weight="700">Clients</text><text x="90" y="244" fill="#e6f0f2" font-size="15">Bootstrap browser PWA</text><text x="90" y="272" fill="#e6f0f2" font-size="15">Bearer-token API</text><text x="90" y="300" fill="#9eb7c2" font-size="13">same permissions and gates</text>
  <rect x="385" y="145" width="410" height="220" rx="22" fill="#123747" stroke="#5aa3ae"/><text x="420" y="190" fill="#79d6d4" font-size="21" font-weight="700">Flask application boundary</text><rect x="420" y="215" width="155" height="105" rx="12" fill="#0c2532"/><text x="438" y="245" fill="#eef7f8" font-size="15" font-weight="700">Routes / API</text><text x="438" y="273" fill="#9eb7c2" font-size="13">CSRF or bearer auth</text><text x="438" y="296" fill="#9eb7c2" font-size="13">audit events</text><rect x="600" y="215" width="160" height="105" rx="12" fill="#0c2532"/><text x="618" y="245" fill="#eef7f8" font-size="15" font-weight="700">Policy gates</text><text x="618" y="273" fill="#9eb7c2" font-size="13">role permission</text><text x="618" y="296" fill="#9eb7c2" font-size="13">agreement + entitlement</text>
  <rect x="890" y="170" width="250" height="150" rx="18" fill="#102f40" stroke="#3f6d7e"/><text x="920" y="210" fill="#79d6d4" font-size="18" font-weight="700">External providers</text><text x="920" y="244" fill="#e6f0f2" font-size="15">OIDC · SMTP · PayPal</text><text x="920" y="274" fill="#9eb7c2" font-size="13">secrets never enter DataTiles</text>
  <rect x="250" y="460" width="330" height="150" rx="18" fill="#173b3a" stroke="#4f8f7e"/><text x="280" y="500" fill="#9fe0c3" font-size="18" font-weight="700">Store operational state</text><text x="280" y="532" fill="#e6f0f2" font-size="14">users · roles · settings · audit</text><text x="280" y="558" fill="#e6f0f2" font-size="14">normalized public logo asset</text><text x="280" y="585" fill="#9eb7c2" font-size="13">SQLAlchemy + BRANDING_DIR</text>
  <rect x="680" y="460" width="360" height="150" rx="18" fill="#27344d" stroke="#707fae"/><text x="710" y="500" fill="#bdc8ff" font-size="18" font-weight="700">Immutable catalog objects</text><text x="710" y="532" fill="#e6f0f2" font-size="14">revision-8 SQLite DataTiles</text><text x="710" y="558" fill="#e6f0f2" font-size="14">numeric arrays · vectors · provenance</text><text x="710" y="585" fill="#9eb7c2" font-size="13">opened read-only / query-only</text></g>
  <g fill="none" stroke="#79d6d4" stroke-width="3" marker-end="url(#a)"><path d="M280 245H378"/><path d="M795 245H883"/><path d="M505 365V450"/><path d="M685 365L820 450"/></g><g fill="#9eb7c2" font-family="system-ui" font-size="12"><text x="305" y="232">HTTPS</text><text x="810" y="232">provider APIs</text><text x="520" y="414">state</text><text x="730" y="409">read / exact download</text></g>
</svg>
