{% extends 'base.html' %}{% block title %}Users · DataTiles Store{% endblock %}{% block content %}<section class="admin-page"><h1>Users</h1><form method="post" class="admin-form"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="username" placeholder="Username" required><input type="password" name="password" placeholder="Password (12+ chars)" minlength="12" required><select name="group"><option value="">No group</option>{% for g in groups %}<option>{{g.name}}</option>{% endfor %}</select><button>Create user</button></form><table><tr><th>User</th><th>Groups</th><th>Permissions</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.groups|map(attribute='name')|join(', ')}}</td><td>{{u.permissions()|sort|join(', ')}}</td></tr>{% endfor %}</table></section>{% endblock %}
