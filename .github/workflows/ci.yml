name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test environment
        # The complete suite exercises the optional signature and DRM contracts.
        run: python -m pip install --upgrade pip && python -m pip install -e '.[demo,test,integrity,drm]'
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run complete test suite
        run: python -m pytest --cov=datatiles --cov-branch --cov-report=term-missing

  browser-contracts:
    name: Browser contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test environment
        run: python -m pip install --upgrade pip && python -m pip install -e '.[demo,test]'
      - name: Parse playground and plugin JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("src/datatiles/profile-demo.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.DOTALL)
          if not scripts:
              raise SystemExit("profile-demo.html contains no inline JavaScript")
          Path("/tmp/datatiles-playground.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/datatiles-playground.js
          node --check plugins/common/datatiles-client.js
          node --check plugins/leaflet/datatiles-leaflet.js
          node --check plugins/openlayers/datatiles-openlayers.js
          node --check plugins/google-maps/datatiles-google-maps.js
      - name: Verify live-rendering contracts
        run: python -m pytest tests/test_profile.py tests/test_surface.py tests/test_documentation.py

  import-utilities:
    name: Scientific import utilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install utility test environment
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test,utils]'
      - name: Compile utility sources
        run: python -m compileall -q utils
      - name: Verify utility command interfaces
        run: |
          python utils/netcdf2datatiles.py --help
          python utils/grib2datatiles.py --help
          python utils/zarr2datatiles.py --help
          python utils/meteouniparthenope2datatiles.py --help
          python utils/geojson2datatiles --help
          python utils/csv2datatiles --help
          python utils/xml2datatiles --help
          python utils/gpx2datatiles --help
          python utils/ndjson2datatiles --help
      - name: Test scientific and feature import utilities
        run: python -m pytest -q tests/test_import_utils.py tests/test_utils.py

  online-delivery:
    name: Online server and Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install server and Store test environments
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[server,test]'
          python -m pip install -e './store[test]'
      - name: Compile optional component sources
        run: python -m compileall -q server store
      - name: Test server and Store contracts
        run: python -m pytest -q server/tests store/tests

  containers:
    name: Server container and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose model
        run: |
          cp server/layers.example.json server/layers.json
          mkdir -p server/data server/cache
          docker compose --file server/docker-compose.yml config --quiet
          DATATILES_STORE_SECRET_KEY=ci-only-secret DATATILES_STORE_ADMIN_PASSWORD=ci-only-password docker compose --file store/docker-compose.yml config --quiet
      - name: Build server and Store images
        run: |
          docker build --tag datatiles-server:ci --file server/Dockerfile .
          docker build --tag datatiles-store:ci store
      - name: Verify non-root runtimes and health endpoints
        run: |
          server_id=$(docker run --detach --publish 127.0.0.1:8080:8080 --env DATATILES_WORKERS=2 datatiles-server:ci)
          store_id=$(docker run --detach --publish 127.0.0.1:8081:8080 --env DATATILES_STORE_SECRET_KEY=ci-only-secret --env DATATILES_STORE_ADMIN_PASSWORD=ci-only-password datatiles-store:ci)
          trap 'docker logs "$server_id"; docker logs "$store_id"; docker rm --force "$server_id" "$store_id"' EXIT
          test "$(docker inspect --format '{{.Config.User}}' "$server_id")" = datatiles
          test "$(docker inspect --format '{{.Config.User}}' "$store_id")" = datatiles
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/maps >/dev/null \
              && curl --fail --silent http://127.0.0.1:8081/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/datatiles-wheel-test
          /tmp/datatiles-wheel-test/bin/python -m pip install --no-deps dist/*.whl
          /tmp/datatiles-wheel-test/bin/datatiles --help
          /tmp/datatiles-wheel-test/bin/datatiles-serve --help

  reproducibility:
    name: Scientific fixture reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install reproducibility environment
        run: python -m pip install --upgrade pip && python -m pip install -e '.[demo,test]'
      - name: Build the controlled fixture twice
        run: python -m pytest tests/test_reproducible_demo.py tests/test_tutorial.py

  ci-success:
    name: CI success
    if: always()
    needs: [tests, browser-contracts, import-utilities, online-delivery, containers, package, reproducibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          BROWSER_RESULT: ${{ needs.browser-contracts.result }}
          UTILITIES_RESULT: ${{ needs.import-utilities.result }}
          ONLINE_RESULT: ${{ needs.online-delivery.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          REPRODUCIBILITY_RESULT: ${{ needs.reproducibility.result }}
        run: |
          test "$TESTS_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$UTILITIES_RESULT" = success
          test "$ONLINE_RESULT" = success
          test "$CONTAINERS_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$REPRODUCIBILITY_RESULT" = success
