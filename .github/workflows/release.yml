name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Publish the validated artifacts to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install release environment
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e '.[demo,test,integrity,drm,server]'
          python -m pip install -e './store[test]'
      - name: Validate tag and release metadata
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from datatiles import __version__

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"invalid release tag: {tag}")
          if tag != f"v{__version__}":
              raise SystemExit(f"tag {tag} does not match package version {__version__}")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if not re.search(rf"^## {re.escape(__version__)}(?:\s|—)", changelog, re.MULTILINE):
              raise SystemExit(f"CHANGELOG.md has no {__version__} release heading")
          PY
      - name: Run release quality gates
        run: |
          python -m compileall -q src tests server store
          python -m pytest --cov=datatiles --cov-branch --cov-report=term-missing
          python -m pytest -q server/tests store/tests
          node --check plugins/common/datatiles-client.js
          node --check plugins/leaflet/datatiles-leaflet.js
          node --check plugins/openlayers/datatiles-openlayers.js
          node --check plugins/google-maps/datatiles-google-maps.js
      - name: Build and smoke-test reference server container
        run: |
          cp server/layers.example.json server/layers.json
          mkdir -p server/data server/cache
          docker compose --file server/docker-compose.yml config --quiet
          DATATILES_STORE_SECRET_KEY=release-validation-secret DATATILES_STORE_ADMIN_PASSWORD=release-validation-password docker compose --file store/docker-compose.yml config --quiet
          docker build --tag datatiles-server:release --file server/Dockerfile .
          docker build --tag datatiles-store:release store
          server_id=$(docker run --detach --publish 127.0.0.1:8080:8080 --env DATATILES_WORKERS=2 datatiles-server:release)
          store_id=$(docker run --detach --publish 127.0.0.1:8081:8080 --env DATATILES_STORE_SECRET_KEY=release-validation-secret --env DATATILES_STORE_ADMIN_PASSWORD=release-validation-password datatiles-store:release)
          trap 'docker logs "$server_id"; docker logs "$store_id"; docker rm --force "$server_id" "$store_id"' EXIT
          test "$(docker inspect --format '{{.Config.User}}' "$server_id")" = datatiles
          test "$(docker inspect --format '{{.Config.User}}' "$store_id")" = datatiles
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/maps >/dev/null \
              && curl --fail --silent http://127.0.0.1:8081/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Build distributions and checksums
        run: |
          python -m build
          python -m twine check dist/*
          tar --create --gzip --file dist/components.tar.gz plugins server store docs/online-delivery.md docs/specification-revision-9-addendum.md
          cd dist
          sha256sum datatiles-* components.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/datatiles-*.tar.gz
          if-no-files-found: error

  container-images:
    name: Publish server and Store images
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize GHCR image namespace
        id: images
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.images.outputs.owner }}/datatiles-server:${{ github.ref_name }}
            ghcr.io/${{ steps.images.outputs.owner }}/datatiles-server:latest
      - uses: docker/build-push-action@v7
        with:
          context: store
          file: store/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.images.outputs.owner }}/datatiles-store:${{ github.ref_name }}
            ghcr.io/${{ steps.images.outputs.owner }}/datatiles-store:latest

  attest:
    name: Attest build provenance
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"

  github-release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: [build, attest, container-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-assets
          path: dist
      - name: Publish immutable release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --verify-tag --generate-notes

  publish-pypi:
    name: Publish to PyPI
    if: github.ref_type == 'tag' || inputs.publish_to_pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/datatiles
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
