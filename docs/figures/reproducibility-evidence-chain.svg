<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Reproducibility and evidence chain</title>
  <desc id="desc">Immutable source responses, checksums, configuration, and runtime locks enter a deterministic derivation. Two clean builds must produce byte-identical DataTiles and evidence bundles, followed by independent scientific verification and publication evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker>
    <style>text{font-family:Inter,Arial,sans-serif;fill:#17324d}.title{font-size:30px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.box{stroke:#315b7d;stroke-width:2}.arrow{stroke:#315b7d;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#7a5aa6;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">From Gaeta to Maratea reproducibility and evidence chain</text>

  <rect x="45" y="105" width="250" height="190" rx="12" fill="#e8f3f8" class="box"/>
  <text x="170" y="142" text-anchor="middle" class="label">Locked inputs</text>
  <text x="170" y="178" text-anchor="middle" class="body">immutable raw responses</text>
  <text x="170" y="207" text-anchor="middle" class="body">request URLs + licences</text>
  <text x="170" y="236" text-anchor="middle" class="body">source SHA-256 lock</text>
  <text x="170" y="265" text-anchor="middle" class="body">configuration + runtime</text>

  <line x1="295" y1="200" x2="373" y2="200" stroke="#315b7d" stroke-width="3"/><polygon points="373,194 385,200 373,206" fill="#315b7d"/>
  <rect x="385" y="105" width="300" height="190" rx="12" fill="#fff5dc" class="box"/>
  <text x="535" y="142" text-anchor="middle" class="label">Deterministic derivation</text>
  <text x="535" y="177" text-anchor="middle" class="body">fixed geometry and resampling</text>
  <text x="535" y="206" text-anchor="middle" class="body">declared classification/fusion</text>
  <text x="535" y="235" text-anchor="middle" class="body">stable ordering + canonical JSON</text>
  <text x="535" y="264" text-anchor="middle" class="body">fixed SQLite/ZIP finalization</text>

  <line x1="685" y1="200" x2="735" y2="200" stroke="#315b7d" stroke-width="3"/>
  <line x1="735" y1="137" x2="735" y2="262" stroke="#315b7d" stroke-width="3"/>
  <line x1="735" y1="137" x2="768" y2="137" stroke="#315b7d" stroke-width="3"/><polygon points="768,131 780,137 768,143" fill="#315b7d"/>
  <line x1="735" y1="262" x2="768" y2="262" stroke="#315b7d" stroke-width="3"/><polygon points="768,256 780,262 768,268" fill="#315b7d"/>
  <rect x="780" y="90" width="180" height="95" rx="12" fill="#eaf6ea" class="box"/>
  <text x="870" y="125" text-anchor="middle" class="label">Clean build A</text>
  <text x="870" y="156" text-anchor="middle" class="small">DataTiles + evidence ZIP</text>
  <rect x="780" y="215" width="180" height="95" rx="12" fill="#eaf6ea" class="box"/>
  <text x="870" y="250" text-anchor="middle" class="label">Clean build B</text>
  <text x="870" y="281" text-anchor="middle" class="small">DataTiles + evidence ZIP</text>

  <line x1="960" y1="137" x2="990" y2="137" stroke="#315b7d" stroke-width="3"/><line x1="990" y1="137" x2="990" y2="190" stroke="#315b7d" stroke-width="3"/><line x1="990" y1="190" x2="1008" y2="190" stroke="#315b7d" stroke-width="3"/><polygon points="1008,184 1020,190 1008,196" fill="#315b7d"/>
  <line x1="960" y1="262" x2="990" y2="262" stroke="#315b7d" stroke-width="3"/><line x1="990" y1="218" x2="990" y2="262" stroke="#315b7d" stroke-width="3"/><line x1="990" y1="218" x2="1008" y2="218" stroke="#315b7d" stroke-width="3"/><polygon points="1008,212 1020,218 1008,224" fill="#315b7d"/>
  <rect x="1020" y="165" width="145" height="78" rx="12" fill="#f1ecfa" class="box"/>
  <text x="1092" y="195" text-anchor="middle" class="label">SHA-256</text>
  <text x="1092" y="222" text-anchor="middle" class="small">byte identity</text>

  <line x1="600" y1="310" x2="600" y2="373" stroke="#315b7d" stroke-width="3"/><polygon points="594,373 600,385 606,373" fill="#315b7d"/>
  <rect x="160" y="390" width="400" height="145" rx="12" fill="#f3f5f7" class="box"/>
  <text x="360" y="428" text-anchor="middle" class="label">Scientific verification</text>
  <text x="360" y="462" text-anchor="middle" class="body">source-versus-tile checkpoints · units/datum</text>
  <text x="360" y="491" text-anchor="middle" class="body">nodata/coastline · class rules · query boundaries</text>
  <text x="360" y="518" text-anchor="middle" class="small">Byte identity alone does not establish correctness.</text>

  <rect x="640" y="390" width="400" height="145" rx="12" fill="#f3f5f7" class="box"/>
  <text x="840" y="428" text-anchor="middle" class="label">FAIR publication evidence</text>
  <text x="840" y="462" text-anchor="middle" class="body">PID + licence + CRS + units + provenance</text>
  <text x="840" y="491" text-anchor="middle" class="body">checksums + access links + retention policy</text>
  <text x="840" y="518" text-anchor="middle" class="small">Container checks and repository claims remain distinct.</text>

  <line x1="560" y1="462" x2="628" y2="462" stroke="#7a5aa6" stroke-width="3" stroke-dasharray="8 6"/><polygon points="628,456 640,462 628,468" fill="#7a5aa6"/>
  <rect x="235" y="590" width="730" height="72" rx="12" fill="#fff0ee" stroke="#a34b43" stroke-width="2"/>
  <text x="600" y="620" text-anchor="middle" class="label">Scope limitation</text>
  <text x="600" y="648" text-anchor="middle" class="body">Reference scientific demonstration only — not for navigation.</text>
</svg>
