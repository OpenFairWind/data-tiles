<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">DataTiles information model</title>
  <desc id="desc">A spatial tile address and an unordered typed scientific coordinate set resolve to a declared content profile and stored payload, while one selected compatible slice is projected through the standard MBTiles interface.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#17324d}.title{font-size:30px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px}.box{stroke:#315b7d;stroke-width:2}.arrow{stroke:#315b7d;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">DataTiles information model</text>

  <rect x="55" y="105" width="280" height="155" rx="12" fill="#e8f3f8" class="box"/>
  <text x="195" y="142" text-anchor="middle" class="label">Spatial address</text>
  <text x="195" y="184" text-anchor="middle" class="body">zoom level z</text>
  <text x="195" y="214" text-anchor="middle" class="body">tile column x</text>
  <text x="195" y="244" text-anchor="middle" class="body">TMS tile row y</text>

  <rect x="55" y="315" width="280" height="210" rx="12" fill="#f1ecfa" class="box"/>
  <text x="195" y="352" text-anchor="middle" class="label">Scientific coordinates</text>
  <text x="195" y="390" text-anchor="middle" class="body">variable = depth</text>
  <text x="195" y="420" text-anchor="middle" class="body">valid_time = interval</text>
  <text x="195" y="450" text-anchor="middle" class="body">elevation = 0 m</text>
  <text x="195" y="486" text-anchor="middle" class="small">typed, unordered, canonical</text>

  <line x1="335" y1="182" x2="428" y2="182" stroke="#315b7d" stroke-width="3"/><polygon points="428,176 440,182 428,188" fill="#315b7d"/>
  <line x1="335" y1="420" x2="431" y2="244" stroke="#315b7d" stroke-width="3"/><polygon points="423,246 440,235 434,253" fill="#315b7d"/>

  <rect x="440" y="125" width="320" height="310" rx="12" fill="#fff5dc" class="box"/>
  <text x="600" y="165" text-anchor="middle" class="label">Coordinate-set identity</text>
  <text x="600" y="203" text-anchor="middle" class="body">canonical typed serialization</text>
  <text x="600" y="235" text-anchor="middle" class="body">SHA-256 stable key</text>
  <line x1="485" y1="260" x2="715" y2="260" stroke="#b78b28" stroke-width="2"/>
  <text x="600" y="300" text-anchor="middle" class="label">Declared content profile</text>
  <text x="600" y="337" text-anchor="middle" class="body">raster matrix or vector features</text>
  <text x="600" y="369" text-anchor="middle" class="body">media type · encoding · schema</text>
  <text x="600" y="405" text-anchor="middle" class="small">No type is inferred from opaque bytes</text>

  <line x1="760" y1="280" x2="838" y2="280" stroke="#315b7d" stroke-width="3"/><polygon points="838,274 850,280 838,286" fill="#315b7d"/>
  <rect x="850" y="125" width="295" height="310" rx="12" fill="#eaf6ea" class="box"/>
  <text x="997" y="165" text-anchor="middle" class="label">Stored tile payload</text>
  <rect x="890" y="198" width="215" height="78" rx="8" fill="#d8eddb" stroke="#4e8055"/>
  <text x="997" y="230" text-anchor="middle" class="body">Scientific arrays</text>
  <text x="997" y="257" text-anchor="middle" class="small">DNT1 values + semantics</text>
  <rect x="890" y="300" width="215" height="96" rx="8" fill="#dcecf7" stroke="#47799b"/>
  <text x="997" y="332" text-anchor="middle" class="body">Portrayals or features</text>
  <text x="997" y="359" text-anchor="middle" class="small">PNG/JPEG/WebP</text>
  <text x="997" y="382" text-anchor="middle" class="small">MVT or GeoJSON</text>

  <line x1="997" y1="435" x2="997" y2="518" stroke="#315b7d" stroke-width="3"/><polygon points="991,518 997,530 1003,518" fill="#315b7d"/>
  <rect x="690" y="530" width="455" height="105" rx="12" fill="#f3f5f7" class="box"/>
  <text x="917" y="568" text-anchor="middle" class="label">Selected compatible slice</text>
  <text x="917" y="601" text-anchor="middle" class="body">standard metadata + four-column tiles view</text>
  <text x="917" y="624" text-anchor="middle" class="small">physical-table export when standalone MBTiles is required</text>

  <text x="55" y="605" class="body" font-weight="700">Invariant</text>
  <text x="55" y="633" class="small">Scientific values remain data.</text>
  <text x="55" y="655" class="small">Rendering requires an explicit, provenance-recorded derivation.</text>
</svg>
