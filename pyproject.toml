[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datatiles"
version = "0.10.0"
description = "MBTiles-compatible multidimensional raster-matrix and vector-feature storage"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Raffaele Montella"}]
keywords = ["mbtiles", "multidimensional", "geospatial", "raster", "vector-tiles", "FAIR-data", "SQLite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.optional-dependencies]
demo = [
  "numpy==2.2.6; python_version < '3.11'",
  "numpy==2.3.5; python_version >= '3.11'",
  "Pillow==12.3.0",
]
test = ["pytest==8.4.2", "pytest-cov==7.0.0"]

[project.scripts]
datatiles = "datatiles.cli:main"
datatiles-serve = "datatiles.server:main"
datatiles-demo = "datatiles.demo:main"
datatiles-profile = "datatiles.profile:main"

[tool.setuptools.package-data]
datatiles = ["schema.sql", "profile-demo.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
