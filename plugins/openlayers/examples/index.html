<!doctype html><meta charset="utf-8"><title>DataTiles + OpenLayers</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css"><style>#map{height:100vh}body{margin:0}</style><div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script><script type="module">
import {serverLayer,clientLayer} from "../datatiles-openlayers.js";
const base="http://localhost:8080", portrayal={palette:[[0,"#313695"],[10,"#74add1"],[20,"#ffffbf"],[30,"#f46d43"],[40,"#a50026"]]}, dims={variable:"air_temperature"};
const server=serverLayer(ol,base,"temperature",{dimensions:dims,opacity:.75});
new ol.Map({target:"map",layers:[new ol.layer.Tile({source:new ol.source.OSM()}),server],view:new ol.View({center:ol.proj.fromLonLat([14.5,40.7]),zoom:6})});
// Replace `server` with clientLayer(ol,base,"weather",portrayal,{dimensions:dims}) to render DNT1 in the browser.
</script>
